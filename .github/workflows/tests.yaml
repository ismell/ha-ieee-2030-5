name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.19"
      - run: uvx ruff@0.16.10 check custom_components tests
      - run: uvx ruff@0.16.10 format --check custom_components tests

  test:
    # The oldest Home Assistant the integration supports (hacs.json) and the latest.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        phcc: ["0.13.367", "0.13.372"] # Home Assistant 2026.9.4, 2026.10.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.19"
          python-version: "3.14"
      - name: Install
        run: |
          uv venv
          uv pip install "pytest-homeassistant-custom-component==${{ matrix.phcc }}" pytest-cov \
            "$(python3 -c 'import json; print(json.load(open("custom_components/ieee_2030_5/manifest.json"))["requirements"][0])')"
      - run: uv run --no-project pytest -q --cov=custom_components.ieee_2030_5 --cov-fail-under=100
